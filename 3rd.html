<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern To-Do App</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
      color:white;
    }

    .container{
      width:100%;
      max-width:700px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:24px;
      padding:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .title{
      text-align:center;
      margin-bottom:25px;
    }

    .title h1{
      font-size:2.5rem;
      font-weight:700;
      background:linear-gradient(90deg,#38bdf8,#818cf8);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .title p{
      color:#cbd5e1;
      margin-top:8px;
      font-size:0.95rem;
    }

    .input-section{
      display:flex;
      gap:12px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    .input-section input{
      flex:1;
      padding:15px;
      border:none;
      border-radius:14px;
      outline:none;
      background:rgba(255,255,255,0.1);
      color:white;
      font-size:1rem;
    }

    .input-section input::placeholder{
      color:#cbd5e1;
    }

    .add-btn{
      padding:15px 22px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#06b6d4,#6366f1);
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .add-btn:hover{
      transform:translateY(-2px);
      opacity:0.9;
    }

    .filters{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    .filter-btn{
      padding:10px 18px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,0.08);
      color:white;
      cursor:pointer;
      transition:0.3s;
    }

    .filter-btn.active{
      background:linear-gradient(135deg,#06b6d4,#6366f1);
    }

    .todo-list{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .todo{
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.08);
      padding:18px;
      border-radius:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      animation:fadeIn 0.3s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .todo-left{
      display:flex;
      align-items:center;
      gap:15px;
      flex:1;
    }

    .todo-left input[type="checkbox"]{
      width:20px;
      height:20px;
      cursor:pointer;
      accent-color:#6366f1;
    }

    .task-text{
      font-size:1rem;
      word-break:break-word;
    }

    .completed{
      text-decoration:line-through;
      opacity:0.6;
    }

    .todo-actions{
      display:flex;
      gap:10px;
    }

    .edit-btn,
    .delete-btn,
    .save-btn,
    .cancel-btn{
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      color:white;
      font-weight:500;
      transition:0.3s;
    }

    .edit-btn{
      background:#0ea5e9;
    }

    .delete-btn{
      background:#ef4444;
    }

    .save-btn{
      background:#22c55e;
    }

    .cancel-btn{
      background:#f59e0b;
    }

    .edit-btn:hover,
    .delete-btn:hover,
    .save-btn:hover,
    .cancel-btn:hover{
      opacity:0.85;
      transform:scale(1.03);
    }

    .edit-input{
      width:100%;
      padding:10px;
      border:none;
      outline:none;
      border-radius:10px;
      background:rgba(255,255,255,0.12);
      color:white;
    }

    .empty{
      text-align:center;
      color:#cbd5e1;
      margin-top:10px;
    }

    .footer{
      margin-top:25px;
      text-align:center;
      color:#cbd5e1;
      font-size:0.9rem;
    }

    @media(max-width:600px){
      .todo{
        flex-direction:column;
        align-items:flex-start;
      }

      .todo-actions{
        width:100%;
      }

      .todo-actions button{
        flex:1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      <h1>Task Manager</h1>
      <p>Modern JavaScript CRUD To-Do Application</p>
    </div>

    <!-- Input -->
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Enter your task...">
      <button class="add-btn" id="addTaskBtn">Add Task</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Todo List -->
    <div class="todo-list" id="todoList"></div>

    <div class="empty" id="emptyMessage">
      No tasks added yet.
    </div>

    <div class="footer">
      Data automatically saved using Local Storage
    </div>

  </div>

<script>

  // =========================
  // DOM Elements
  // =========================

  const taskInput = document.getElementById("taskInput");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const todoList = document.getElementById("todoList");
  const filterButtons = document.querySelectorAll(".filter-btn");
  const emptyMessage = document.getElementById("emptyMessage");

  // =========================
  // App State
  // =========================

  let todos = JSON.parse(localStorage.getItem("todos")) || [];
  let currentFilter = "all";

  // =========================
  // Save To Local Storage
  // =========================

  function saveTodos() {
    localStorage.setItem("todos", JSON.stringify(todos));
  }

  // =========================
  // Render Todos
  // =========================

  function renderTodos() {

    todoList.innerHTML = "";

    let filteredTodos = todos.filter(todo => {

      if(currentFilter === "active") {
        return !todo.completed;
      }

      if(currentFilter === "completed") {
        return todo.completed;
      }

      return true;
    });

    emptyMessage.style.display =
      filteredTodos.length === 0 ? "block" : "none";

    filteredTodos.forEach(todo => {

      const todoItem = document.createElement("div");
      todoItem.className = "todo";

      todoItem.innerHTML = `
        <div class="todo-left">

          <input type="checkbox"
            ${todo.completed ? "checked" : ""}
            data-id="${todo.id}"
            class="toggle-checkbox">

          <div class="task-container">
            <p class="task-text ${todo.completed ? "completed" : ""}">
              ${todo.text}
            </p>
          </div>

        </div>

        <div class="todo-actions">

          <button class="edit-btn" data-id="${todo.id}">
            Edit
          </button>

          <button class="delete-btn" data-id="${todo.id}">
            Delete
          </button>

        </div>
      `;

      todoList.appendChild(todoItem);
    });

    saveTodos();
  }

  // =========================
  // Add Task
  // =========================

  function addTask() {

    const taskText = taskInput.value.trim();

    if(taskText === "") {
      alert("Please enter a task");
      return;
    }

    const newTodo = {
      id: Date.now(),
      text: taskText,
      completed: false
    };

    todos.unshift(newTodo);

    taskInput.value = "";

    renderTodos();
  }

  addTaskBtn.addEventListener("click", addTask);

  // Enter Key Support
  taskInput.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
      addTask();
    }
  });

  // =========================
  // Event Delegation
  // =========================

  todoList.addEventListener("click", function(e){

    const id = Number(e.target.dataset.id);

    // DELETE
    if(e.target.classList.contains("delete-btn")){

      todos = todos.filter(todo => todo.id !== id);

      renderTodos();
    }

    // EDIT
    if(e.target.classList.contains("edit-btn")){

      const todo = todos.find(todo => todo.id === id);

      const todoCard = e.target.closest(".todo");

      todoCard.innerHTML = `
        <div class="todo-left" style="width:100%">
          <input type="text"
            class="edit-input"
            value="${todo.text}">
        </div>

        <div class="todo-actions">

          <button class="save-btn">
            Save
          </button>

          <button class="cancel-btn">
            Cancel
          </button>

        </div>
      `;

      const saveBtn = todoCard.querySelector(".save-btn");
      const cancelBtn = todoCard.querySelector(".cancel-btn");
      const editInput = todoCard.querySelector(".edit-input");

      saveBtn.addEventListener("click", () => {

        const updatedText = editInput.value.trim();

        if(updatedText === ""){
          alert("Task cannot be empty");
          return;
        }

        todo.text = updatedText;

        renderTodos();
      });

      cancelBtn.addEventListener("click", renderTodos);
    }

  });

  // =========================
  // Checkbox Toggle
  // =========================

  todoList.addEventListener("change", function(e){

    if(e.target.classList.contains("toggle-checkbox")){

      const id = Number(e.target.dataset.id);

      const todo = todos.find(todo => todo.id === id);

      todo.completed = e.target.checked;

      renderTodos();
    }

  });

  // =========================
  // Filter Buttons
  // =========================

  filterButtons.forEach(button => {

    button.addEventListener("click", () => {

      filterButtons.forEach(btn =>
        btn.classList.remove("active")
      );

      button.classList.add("active");

      currentFilter = button.dataset.filter;

      renderTodos();
    });

  });

  // =========================
  // Initial Render
  // =========================

  renderTodos();

</script>

</body>
</html>
